name: Bootstrap Selah source

on:
  push:
    branches:
      - main
    paths:
      - bootstrap/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify Selah source
        shell: bash
        run: |
          set -euo pipefail

          cat bootstrap/part-* > /tmp/selah.b64

          actual_b64_size="$(wc -c < /tmp/selah.b64 | tr -d ' ')"
          test "$actual_b64_size" = "90396"

          printf '%s  %s\n'             "c21b53c20cad236c79ab6e285afd7409977aa30ffb9197e2b1cc3b5bd21d66dd"             "/tmp/selah.b64" | sha256sum --check -

          base64 --decode /tmp/selah.b64 > /tmp/selah.tar.gz

          actual_tar_size="$(wc -c < /tmp/selah.tar.gz | tr -d ' ')"
          test "$actual_tar_size" = "67795"

          printf '%s  %s\n'             "0e1cb995dee63b10a88b8ec0985ce3cbb91b288fe06e76d6dd154f30782c7dec"             "/tmp/selah.tar.gz" | sha256sum --check -

          mkdir -p /tmp/selah-src
          tar -xzf /tmp/selah.tar.gz -C /tmp/selah-src

          test -f /tmp/selah-src/package.json
          test -f /tmp/selah-src/src/domain/references/reference.ts
          test -f /tmp/selah-src/web/app.js
          test -f /tmp/selah-src/.github/workflows/ci.yml

      - name: Replace bootstrap tree with verified source
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/selah-src/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit             -m "Import Selah implementation milestone"             -m "Verified local milestones: 95ebd32, 42275c1, 17d792b"
          git push origin HEAD:main
