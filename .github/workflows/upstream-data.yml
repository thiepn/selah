name: Verify Bible Data Upstream

on:
  push:
    branches: [main]
    paths:
      - 'scripts/data/**'
      - 'scripts/validate-site.mjs'
      - 'src/data/bsb/**'
      - 'src/data/web/**'
      - 'src/domain/references/**'
      - 'src/research/cross-references/**'
      - 'fixtures/bsb/**'
      - 'fixtures/web/**'
      - 'data/manifests/sources.json'
      - 'package.json'
      - '.github/workflows/upstream-data.yml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: selah-upstream-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-bsb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run data:vendor:bsb
      - run: npm run data:vendor:web
      - run: npm run data:canonicalize:bsb
      - run: npm run data:validate:vendored
      - run: npm run data:validate:web
      - run: npm run data:build:concordance
      - run: npm run data:build:crossrefs
      - run: npm run data:verify:research
      - run: npm run data:build:search
      - run: npm run build:site
      - run: npm run data:measure
