name: Verify Bible Data Upstream

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-bsb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run data:vendor:bsb
      - run: npm run data:validate:vendored
      - run: npm run data:build:crossrefs
      - run: npm run data:build:search
      - run: npm run build:site
