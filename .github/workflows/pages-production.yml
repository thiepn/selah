name: Selah Pages Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: selah-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build full production site
        run: npm run build:production
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run release browser acceptance
        run: npm run test:browser:ci
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload tested production site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy tested production site
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke live production
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --fail --location --retry 6 --retry-delay 3 --retry-all-errors "$PAGE_URL" -o /tmp/selah-index.html
          grep -q '<title>Selah' /tmp/selah-index.html
