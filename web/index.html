<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2eb">
  <meta name="description" content="Selah — a passage-centered Bible study workspace">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>Selah</title>
</head>
<body>
  <header class="topbar">
    <button class="wordmark" id="wordmark" type="button" aria-label="Selah">SELAH</button>
    <form class="reference-form" id="referenceForm" autocomplete="off">
      <button class="icon-button" id="backBtn" type="button" aria-label="Back in research history">←</button>
      <button class="icon-button" id="forwardBtn" type="button" aria-label="Forward in research history">→</button>
      <label class="sr-only" for="referenceInput">Bible reference</label>
      <input id="referenceInput" spellcheck="false" value="" placeholder="Romans 8:1–17" aria-label="Bible reference">
    </form>
    <nav class="top-actions" aria-label="Study actions">
      <button class="text-button" id="exportBtn" type="button">Export</button>
      <button class="text-button review-button" id="reviewBtn" type="button">Review <span id="reviewDueCount" hidden></span></button>
      <button class="text-button" id="studiesBtn" type="button">Studies</button>
      <button class="icon-button" id="themeBtn" type="button" aria-label="Toggle theme">◐</button>
    </nav>
  </header>

  <main class="workspace" id="workspace">
    <section class="bible-pane" id="biblePane" aria-label="Scripture">
      <div class="passage-meta">
        <button class="chapter-nav" id="prevChapterBtn" type="button" aria-label="Previous chapter">‹</button>
        <span class="translation">BSB</span>
        <span id="passageStatus">Loading…</span>
        <button class="chapter-nav" id="nextChapterBtn" type="button" aria-label="Next chapter">›</button>
      </div>
      <article class="scripture" id="scripture" aria-live="polite"></article>
    </section>
    <div class="divider" id="divider" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize Scripture and study panes" aria-valuemin="38" aria-valuemax="72" aria-valuenow="56"></div>
    <aside class="study-pane" id="studyPane" aria-label="Study tools">
      <nav class="study-tabs" id="studyTabs" aria-label="Study tools" role="tablist" aria-orientation="horizontal">
        <button class="tab active" id="tab-guide" data-tab="guide" type="button" role="tab" aria-selected="true" aria-controls="studyContent" tabindex="0">Guide</button>
        <button class="tab" id="tab-notes" data-tab="notes" type="button" role="tab" aria-selected="false" aria-controls="studyContent" tabindex="-1">Notes</button>
        <button class="tab" id="tab-outline" data-tab="outline" type="button" role="tab" aria-selected="false" aria-controls="studyContent" tabindex="-1">Outline</button>
        <button class="tab" id="tab-synthesis" data-tab="synthesis" type="button" role="tab" aria-selected="false" aria-controls="studyContent" tabindex="-1">Synthesis</button>
        <button class="tab" id="tab-references" data-tab="references" type="button" role="tab" aria-selected="false" aria-controls="studyContent" tabindex="-1">References</button>
        <button class="tab" id="tab-words" data-tab="words" type="button" role="tab" aria-selected="false" aria-controls="studyContent" tabindex="-1">Words</button>
        <button class="tab" id="tab-compare" data-tab="compare" type="button" role="tab" aria-selected="false" aria-controls="studyContent" tabindex="-1">Compare</button>
        <button class="tab" id="tab-phrasing" data-tab="phrasing" type="button" role="tab" aria-selected="false" aria-controls="studyContent" tabindex="-1">Phrasing</button>
        <button class="tab" id="tab-resources" data-tab="resources" type="button" role="tab" aria-selected="false" aria-controls="studyContent" tabindex="-1">Resources</button>
      </nav>
      <div class="study-content" id="studyContent" role="tabpanel" aria-labelledby="tab-guide" tabindex="0"></div>
    </aside>
  </main>

  <footer class="study-bar">
    <div class="history-label"><span class="dot"></span><span id="saveState">saved locally</span></div>
    <div class="study-actions">
      <button id="patternsBtn" type="button" aria-pressed="false">Patterns</button>
      <button id="focusBtn" type="button" aria-pressed="false">Reading focus</button>
    </div>
  </footer>

  <div class="selection-menu" id="selectionMenu" role="toolbar" aria-label="Scripture selection actions" hidden>
    <div class="selection-lens-meta" id="selectionLensMeta"></div>
    <button data-action="note" type="button" aria-keyshortcuts="N" title="Add note (N)">Note</button>
    <button data-action="question" type="button" aria-keyshortcuts="Q" title="Add question (Q)">Question</button>
    <button data-action="highlight" type="button" aria-keyshortcuts="H" title="Highlight selection (H)">Highlight</button>
    <button data-action="outline" type="button" aria-keyshortcuts="O" title="Add selection to outline (O)">Outline</button>
    <button data-action="word" type="button">Word</button>
    <button data-action="compare" type="button">Compare</button>
    <button data-action="copy" type="button">Copy</button>
  </div>

  <dialog class="note-dialog" id="noteDialog">
    <form method="dialog" id="noteForm">
      <header><strong id="noteDialogTitle">Add note</strong><button class="icon-button" value="cancel" aria-label="Close">×</button></header>
      <p class="quiet" id="noteAnchorLabel"></p>
      <textarea id="noteBody" rows="6" placeholder="Write what you observe, question, or infer from the text…"></textarea>
      <footer><button value="cancel" class="text-button">Cancel</button><button value="default" id="saveNoteBtn" class="primary-button">Save note</button></footer>
    </form>
  </dialog>

  <aside class="peek" id="peek" hidden aria-live="polite">
    <header><div><span class="eyebrow">REFERENCE PEEK</span><h3 id="peekTitle"></h3></div><button class="icon-button" id="peekClose" type="button" aria-label="Close">×</button></header>
    <div id="peekText" class="peek-text"></div>
    <button class="open-main" id="peekOpen" type="button">Open as main passage →</button>
  </aside>

  <aside class="drawer" id="studiesDrawer" aria-label="Saved studies" hidden>
    <header><span>STUDIES</span><button class="icon-button" id="drawerClose" type="button" aria-label="Close studies">×</button></header>
    <div class="study-filter-row"><input id="studySearch" placeholder="Search title, passage, or topic…" aria-label="Search studies"><button class="text-button" id="archivedStudiesBtn" type="button" aria-pressed="false">Archived</button></div>
    <div class="study-view-switch" role="group" aria-label="Group studies by"><button type="button" data-study-view="books" aria-pressed="true">Books</button><button type="button" data-study-view="topics" aria-pressed="false">Topics</button></div>
    <div id="studiesList"></div>
    <footer class="drawer-backup"><button class="text-button" id="backupBtn" type="button">Backup</button><button class="text-button" id="restoreBtn" type="button">Restore</button><input id="restoreInput" type="file" accept="application/json,.json" hidden></footer>
  </aside>

  <dialog class="study-meta-dialog" id="studyMetaDialog">
    <form method="dialog" id="studyMetaForm">
      <header><strong>Edit study</strong><button class="icon-button" value="cancel" aria-label="Close">×</button></header>
      <label>Title<input id="studyMetaTitle" maxlength="120" autocomplete="off"></label>
      <label>Topics<input id="studyMetaTags" maxlength="500" autocomplete="off" placeholder="Christology, humility, unity"></label>
      <p class="quiet">Use a few durable themes you would actually search for later. Separate topics with commas.</p>
      <footer><button value="cancel" class="text-button">Cancel</button><button type="submit" value="default" class="primary-button">Save</button></footer>
    </form>
  </dialog>

  <dialog class="study-snapshot-dialog" id="studySnapshotDialog">
    <form method="dialog">
      <header><div><span class="eyebrow">STUDY SNAPSHOT</span><strong id="studySnapshotTitle"></strong></div><button class="icon-button" value="cancel" aria-label="Close">×</button></header>
      <div id="studySnapshotContent"></div>
      <footer><button value="cancel" class="text-button">Close</button><div class="snapshot-footer-actions"><button type="button" class="text-button" id="studySnapshotReview" hidden>Review due</button><button type="button" class="primary-button" id="studySnapshotOpen">Open study</button></div></footer>
    </form>
  </dialog>

  <aside class="drawer review-drawer" id="reviewDrawer" aria-label="Review cards" hidden>
    <header><span>REVIEW</span><button class="icon-button" id="reviewClose" type="button" aria-label="Close review">×</button></header>
    <div class="review-content" id="reviewContent"></div>
  </aside>

  <dialog class="export-dialog" id="exportDialog">
    <form method="dialog">
      <header><strong>Export study context</strong><button class="icon-button" value="cancel" aria-label="Close">×</button></header>
      <label><input type="checkbox" id="exportScripture" checked> Scripture</label>
      <label><input type="checkbox" id="exportAnnotations" checked> Notes and annotations</label>
      <label><input type="checkbox" id="exportDocument" checked> Study document</label>
      <label><input type="checkbox" id="exportOutline" checked> Passage outline</label>
      <label><input type="checkbox" id="exportSynthesis" checked> Synthesis</label>
      <label>Tutoring mode
        <select id="exportTutor">
          <option value="none">None</option>
          <option value="socratic">Socratic tutor</option>
          <option value="check-interpretation">Check interpretation</option>
          <option value="challenge">Challenge my understanding</option>
        </select>
      </label>
      <footer><button value="cancel" class="text-button">Cancel</button><div class="export-actions"><button type="button" class="text-button" id="openChatGPTBtn">Copy &amp; open ChatGPT ↗</button><button type="button" class="primary-button" id="copyExportBtn">Copy Markdown</button></div></footer>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
